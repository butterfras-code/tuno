<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
<!-- Uno walking naturally with floating rhythm notes; proportions guided by his reference photo. Original tUno artwork, adapted for the launcher. -->

<g fill="#73556F" stroke="#73556F" stroke-linecap="round">
<g transform="translate(39 73) rotate(-16)"><ellipse rx="12" ry="8" transform="rotate(-20)" stroke="none"/><path d="M10 -3V-44" stroke-width="4" fill="none"/></g>
<g transform="translate(101 49) rotate(10)"><ellipse rx="11" ry="7" transform="rotate(-20)" stroke="none"/><ellipse cx="37" cy="-7" rx="11" ry="7" transform="rotate(-10 37 -7)" stroke="none"/><path d="M9 -3V-40L46 -47V-10" stroke-width="4" fill="none"/><path d="M9 -39L46 -46" stroke-width="9" fill="none"/></g>
<g transform="translate(207 42) rotate(15)" opacity=".7"><ellipse rx="11" ry="7" transform="rotate(-20)" stroke="none"/><path d="M9 -3V-34Q30 -24 19 -13" stroke-width="4" fill="none"/></g>
</g>
<!-- A side-on walking silhouette: four separate legs, a tucked waist,
     forward-sloping neck and a smaller head, guided by Uno's walking photo. -->
<ellipse cx="153" cy="270" rx="111" ry="8" fill="#DCD2C5"/>
<!-- Far foreleg: lifted underneath the chest. -->
<path d="M125 174C122 190 121 203 127 218L145 239C151 240 155 245 152 249C148 252 138 251 134 247L112 224C108 216 107 194 108 181Z" fill="#252321"/>
<!-- Far hind leg: extended back, with a small grounded paw. -->
<path d="M208 167C220 180 221 198 225 213L246 248C253 248 259 252 257 257C253 260 241 259 238 254L211 220C205 206 197 190 195 177Z" fill="#252321"/>
<!-- Tail tapers from the rump and curves gently upward. -->
<path d="M218 135C245 130 265 115 270 94C272 85 269 77 272 76C278 77 281 91 278 102C272 126 250 145 226 151Z" fill="#302C2B"/>
<!-- Back, ribcage, tucked abdomen and sloping neck form one silhouette. -->
<path d="M91 146C102 136 111 129 129 126C153 123 172 117 193 120C214 121 232 130 235 149C239 166 227 184 211 187C197 190 188 179 174 181C156 187 145 194 126 194C109 195 97 185 90 174L77 165Z" fill="#302C2B"/>
<!-- Near hind leg: thigh forward, hock back, then a relaxed planted paw. -->
<path d="M207 155C217 164 215 181 203 195L190 210C190 217 201 225 202 231C203 239 192 251 187 258C187 262 189 265 183 266H170C165 265 167 260 172 258L186 233C179 227 169 217 170 209C172 197 180 185 183 171Z" fill="#393331"/>
<!-- Near foreleg reaches forward from the shoulder with a soft elbow/wrist. -->
<path d="M116 165C123 179 116 197 107 211L89 242L80 258C80 263 76 266 71 266H59C54 265 57 260 62 258L69 255L86 218C92 201 95 180 101 169Z" fill="#393331"/>
<!-- Small chest marking, collar and tag preserve the familiar Uno details. -->
<path d="M105 174L116 181L110 197L102 204L100 190Z" fill="#F7F0E4"/>
<path d="M92 144C96 155 103 166 116 174" stroke="#A9574D" stroke-width="7" stroke-linecap="round"/>
<circle cx="111" cy="181" r="5" fill="#D6B36A"/>
<!-- Head in profile, carried forward and slightly down rather than upright. -->
<path d="M91 143C78 138 66 143 59 153C54 159 51 168 44 174L32 183C28 187 30 193 36 197C43 201 55 199 62 196L76 185C85 182 94 178 98 170C102 160 100 149 91 143Z" fill="#302C2B"/>
<!-- Floppy ear follows the cheek, attached high on the skull. -->
<path d="M86 145C96 145 100 151 97 161L91 181C88 188 83 187 80 182C76 174 76 160 79 150C80 147 83 145 86 145Z" fill="#252321"/>
<!-- A soft muzzle and a small amber eye keep the expression gentle. -->
<path d="M48 178C45 183 39 185 32 185C29 189 32 194 37 196C44 199 53 197 61 193L65 187C59 188 53 185 48 178Z" fill="#4B4140"/>
<path d="M31 183C35 181 40 183 41 186C41 190 35 192 31 189C29 187 29 185 31 183Z" fill="#211F1E"/>
<path d="M39 194Q49 197 59 190" stroke="#211F1E" stroke-width="2" stroke-linecap="round"/>
<ellipse cx="64" cy="165" rx="4" ry="4.5" fill="#9B7750"/>
<ellipse cx="63" cy="165" rx="2.5" ry="3.2" fill="#211F1E"/>
<circle cx="62.5" cy="163.8" r="1" fill="#FFFCF7"/>
<path d="M61 157Q65 154 69 156" stroke="#4B3B33" stroke-width="2.5" stroke-linecap="round"/>
</svg>
